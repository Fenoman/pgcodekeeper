name: Release Workflow

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  PGCK_MAVEN_REPO: ${{ github.workspace }}/.pgck-m2-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: macos-latest
    steps:

      - name: checkout
        uses: actions/checkout@v6

      - name: verify release identity
        run: python3 script/verify-eclipse-packaging.py --release-tag "${GITHUB_REF_NAME}"

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: resolve optimized Core pin
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/core-ref.env >> "$GITHUB_ENV"

      - name: checkout optimized Core
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PGCK_CORE_REPOSITORY }}
          ref: ${{ env.PGCK_CORE_REF }}
          path: pgcodekeeper-core
          persist-credentials: false

      - name: install optimized Core
        run: mvn -B -ntp -f pgcodekeeper-core/pom.xml clean install -DskipTests -Dmaven.repo.local="${PGCK_MAVEN_REPO}"

      - name: get jarsigner key
        uses: 1arp/create-a-file-action@1cdd9b67e2fa15cff7431f5ba6863466a76a9a9e #v0.4.6
        with:
          path: /tmp/keystore
          isAbsolutePath: false
          file: key.txt
          content: ${{ secrets.KEY_JKS_BASE_64 }}

      - name: decode keystore
        run: base64 --decode -i tmp/keystore/key.txt -o tmp/keystore/key.jks

      - name: create macos certificate
        uses: 1arp/create-a-file-action@1cdd9b67e2fa15cff7431f5ba6863466a76a9a9e #v0.4.6
        with:
          path: /tmp/keystore
          isAbsolutePath: false
          file: certificate.txt
          content: ${{ secrets.MAC_CERT_P12 }}

      - name: create keychain and import certificate
        env:
          MAC_PASS: ${{ secrets.MAC_CERT_PASS }}
        run: |
          base64 --decode -i ${{ github.workspace }}/tmp/keystore/certificate.txt -o certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$MAC_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity build.keychain

      - name: build
        run: |
          set -o pipefail
          run_build() {
            mvn clean -ntp deploy -DskipTests -P code-sign -Dkeystore=${{ github.workspace }}/tmp/keystore/key.jks -Dmaven.repo.local="${PGCK_MAVEN_REPO}" 2>&1 \
              | tee "${RUNNER_TEMP}/build.log"
          }
          if run_build; then
            exit 0
          fi
          # A first clean isolated-repo reactor can lose a freshly built mainapp artifact
          # before assemble-repository reads it. Retry that one failure exactly once.
          if grep -q 'points to a non existing file' "${RUNNER_TEMP}/build.log"; then
            echo '::warning::retrying the known transient Tycho reactor failure once'
            run_build
          else
            exit 1
          fi

      - name: verify release artifacts
        run: >-
          python3 script/verify-eclipse-packaging.py
          --artifacts ru.taximaxim.codekeeper.mainapp/product/rcp/target/products
          --updatesite-dir ru.taximaxim.codekeeper.mainapp/updatesite/target

      - name: set version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: set prefix
        run: echo "PREFIX=pgCodeKeeper-" >> "$GITHUB_ENV"

      - name: set linux build name
        run: echo "LINUX_BUILD=${{ env.PREFIX}}${{ env.RELEASE_VERSION }}-linux.gtk.x86_64.tar.gz" >> $GITHUB_ENV

      - name: set linux aarch64 build name
        run: echo "LINUX_AARCH_BUILD=${{ env.PREFIX }}${{ env.RELEASE_VERSION }}-linux.gtk.aarch64.tar.gz" >> $GITHUB_ENV

      - name: set windows build name
        run: echo "WINDOWS_BUILD=${{ env.PREFIX }}${{ env.RELEASE_VERSION }}-win32.win32.x86_64.zip" >> $GITHUB_ENV

      - name: set macos aarch64 build name
        run: echo "MACOS_AARCH_BUILD=${{ env.PREFIX }}${{ env.RELEASE_VERSION }}-macosx.cocoa.aarch64.tar.gz" >> $GITHUB_ENV

      - name: set macos x86 build name
        run: echo "MACOS_X86_BUILD=${{ env.PREFIX }}${{ env.RELEASE_VERSION }}-macosx.cocoa.x86_64.tar.gz" >> $GITHUB_ENV

      - name: set updatesite name
        run: echo "UPDATESITE=pgCodeKeeper-updatesite-${{ env.RELEASE_VERSION }}.zip" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b #v3.0.1
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: pgCodeKeeper ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/ru.taximaxim.codekeeper.mainapp/product/rcp/target/products/${{ env.LINUX_BUILD }}
            ${{ github.workspace }}/ru.taximaxim.codekeeper.mainapp/product/rcp/target/products/${{ env.LINUX_AARCH_BUILD }}
            ${{ github.workspace }}/ru.taximaxim.codekeeper.mainapp/product/rcp/target/products/${{ env.WINDOWS_BUILD }}
            ${{ github.workspace }}/ru.taximaxim.codekeeper.mainapp/product/rcp/target/products/${{ env.MACOS_AARCH_BUILD }}
            ${{ github.workspace }}/ru.taximaxim.codekeeper.mainapp/product/rcp/target/products/${{ env.MACOS_X86_BUILD }}
            ${{ github.workspace }}/ru.taximaxim.codekeeper.mainapp/updatesite/target/${{ env.UPDATESITE }}
