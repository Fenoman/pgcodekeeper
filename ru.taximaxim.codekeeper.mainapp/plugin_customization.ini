# perspective that the workbench opens initially
org.eclipse.ui/defaultPerspectiveId=ru.taximaxim.codekeeper.ui.mainperspective

# put the perspective switcher on the top right
org.eclipse.ui/DOCK_PERSPECTIVE_BAR=topRight

# show progress on startup
org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP=true

# Detect file-system changes made by Git and external editors.
#
# This is the only pgCodeKeeper tuning that stays product specific. It belongs
# to another bundle (org.eclipse.core.resources) and switches a workspace-wide
# behaviour for every project, not only for pgCodeKeeper ones. The standalone
# product owns its whole workspace and needs it, because the incremental
# project index has to see files that Git and external editors write. A plug-in
# installed into somebody else's Eclipse must not flip that switch for their
# other projects, so the generic deployment keeps the Eclipse default.
#
# Every other pgCodeKeeper setting - the parser worker counts and the
# project-index schema exclusions among them - lives in PreferenceInitializer
# and in project-scoped preferences, so both deployments share it. A value
# added here would silently win over PreferenceInitializer, because product
# customization has a higher precedence than bundle defaults, and it would
# apply to the standalone product alone.
org.eclipse.core.resources/refresh.enabled=true

# Welcome theme to use
org.eclipse.ui.intro/INTRO_THEME = org.eclipse.ui.intro.universal.solstice

# Root page links to show in the Universal Welcome
org.eclipse.ui.intro.universal/INTRO_ROOT_PAGES = overview,tutorials,whatsnew,migrate

# Initial page layout of the Universal Welcome
org.eclipse.ui.intro.universal/INTRO_DATA = product:introData.xml

# check for updates
org.eclipse.equinox.p2.ui.sdk.scheduler/enabled=true
org.eclipse.equinox.p2.ui.sdk.scheduler/schedule=on-fuzzy-schedule
org.eclipse.equinox.p2.ui.sdk.scheduler/fuzzy_recurrence=Once a week
