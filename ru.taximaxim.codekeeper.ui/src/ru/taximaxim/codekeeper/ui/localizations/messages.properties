DiffTableViewer_hidden = Hidden by rules: %s

DiffTableViewer_hidden_hint = %s objects took no part in this comparison. An ignore rule names each of them, so not one of them became a row of this table: they are not in the object count beside this, no migration script mentions them, and nothing on the screen stands for them. An object hidden whole is the one thing a comparison cannot show you, which is why it is counted for you instead.

DiffTableViewer_hidden_hint_columns = Rules of type=COLUMN are not counted here. A column is not a row of this table but a part of the definition of its table, so such a rule hides no object at all: those columns stay on the screen, marked, and the legend above the comparison pane explains the marks.

DiffTableViewer_hidden_hint_idle = %s further rules of the list could have hidden an object and did not. By itself that is no fault - a rule has nothing to take from a comparison that agrees about the objects it names - but it is where to look when this number is lower than it ought to be.

DiffTableViewer_hidden_hint_more_rules = %s further rules hid something.

DiffTableViewer_hidden_hint_no_rule = objects no rule names, which a white list hides by being one

DiffTableViewer_hidden_hint_retired_columns = %s rules of type=COLUMN were not applied to this comparison. It was loaded without analysis, because this project only receives changes from the database, and deciding whether a column such a rule names is still read by a view, a foreign key or an expression needs exactly that analysis. So nothing was asked of these rules: their columns carry no mark here and are written into the project's files like any other. Turn the preference off to have them apply again.

DiffTableViewer_hidden_hint_rule = %s - %s

DiffTableViewer_hidden_nothing = Hidden by rules: nothing

DiffTableViewer_hidden_nothing_hint = Not one object was hidden, while %s rules of the list could have hidden one. By itself that is no fault - a rule has nothing to take from a comparison that agrees about the objects it names - but it is also exactly what a rule looks like once the object was renamed, the pattern mistyped or the db= stopped matching, and until this line existed the two were told apart by nobody.

