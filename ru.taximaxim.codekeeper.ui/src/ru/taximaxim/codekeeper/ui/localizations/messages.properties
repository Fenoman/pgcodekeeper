GeneralPrefPage_enable_body_dependencies = Enable full dependencies from bodies of functions and procedures (experimental)

GeneralPrefPage_format_object_code_automatically = Format object code automatically

GeneralPrefPage_ignore_column_order = Ignore differences in table column order

GeneralPrefPage_ignore_column_statistics = Ignore the statistics target of columns

GeneralPrefPage_ignore_column_statistics_tooltip = The statistics target of a column, the number set by ALTER COLUMN ... SET STATISTICS, takes no part in the comparison and produces no ALTER. It is the right choice where that number is set by a scheduled job on the database rather than by the project. A column the migration creates still carries the target written in the project. Extended statistics objects, created by CREATE STATISTICS, are a different thing and are not affected.

GeneralPrefPage_ignore_sequence_cache = Ignore the CACHE parameter of sequences

GeneralPrefPage_ignore_sequence_cache_tooltip = The cache of a sequence takes no part in the comparison and produces no ALTER, for a sequence of its own and for the identity of a column alike. A sequence the migration creates is still created with the cache written in the project.

GeneralPrefPage_no_alter_table_only = Write ALTER TABLE without ONLY

GeneralPrefPage_no_alter_table_only_tooltip = ONLY keeps a change away from the tables that inherit from the one named, so leaving it out changes nothing in a project without table inheritance. A TimescaleDB hypertable rejects ONLY outright, and whether a table is one differs between the database a script is built against and the databases it is applied to. The two forms TimescaleDB does permit, SET and RESET of options on a table and on a column, keep the word.

GeneralPrefPage_pg_catalog_cache_rows = Persist PostgreSQL catalog rows between comparisons

GeneralPrefPage_pg_catalog_cache_rows_tooltip = Stores PostgreSQL catalog rows in the local workspace state and reuses them in later comparisons. Enabled by default to reduce network traffic. The first comparison may be slower; the cache survives application restarts when the same workspace is used.

GeneralPrefPage_project_index_excluded_schemas = Schemas excluded before project indexing

GeneralPrefPage_project_index_excluded_schemas_tooltip = One exact, case-sensitive schema name per line. Blank lines and lines starting with # are ignored. This affects only the background project index: objects of an excluded schema stop appearing in hover documentation and in the file outline. Database comparison and migration generation are unchanged.
GeneralPrefPage_project_index_excluded_schemas_invalid_dotted = Line %d: schema "%s" contains a dot and cannot be excluded safely in both project layouts. Enter the exact schema name without SQL quotes.
GeneralPrefPage_project_index_excluded_schemas_invalid_filesystem = Line %d: schema "%s" contains characters that cannot be represented safely in project file names. Enter the exact schema name without SQL quotes.

GeneralPrefPage_group_partitions_in_tree = Keep table sections below the tables in the project tree

GeneralPrefPage_group_partitions_in_tree_tooltip = On by default. Nothing is hidden and no file moves: sections stay in their own folder, at their own path, and only change which row they are on. In SCHEMA/tmp/TABLE of a project like OmniX that folder holds 2101 files of which 81 are tables anyone edits, and alphabetically the first fifty rows show seven of those eighty-one; with the sections below, they show fifty, and all eighty-one fit in two screens. Sections are ordered by the table they belong to, so a family stays whole. A folder without sections is ordered exactly as before. The link is taken from the parser, so a PARTITION OF inside a comment is not one; a folder whose index is not built yet keeps its plain ordering until it is.

GeneralPrefPage_nest_partitions_under_parent = Show table sections under their table instead of beside it

GeneralPrefPage_nest_partitions_under_parent_tooltip = Off by default, because this one does take files out of the folder they live in. A section is shown under its own table, behind a single "Sections" node, and is no longer listed in the folder: SCHEMA/tmp/TABLE of a project like OmniX becomes 101 rows instead of 2101. Nothing moves on disk and nothing changes for comparison, migration or export - only the project tree. A section is only taken out of the folder when the file defining its table is in that same folder, proven by the parser and not by the file name; a section whose table is in another schema, in a library or not added to the project yet stays exactly where it is. "Show In" and "Link with Editor" follow the section to its new place.

GeneralPrefPage_project_index_incremental_added_files = Reindex incrementally when a batch adds files

GeneralPrefPage_project_index_incremental_added_files_tooltip = Off by default. Today a pull that brings one new file costs a full rebuild of the project index, even when every other file of the batch could have been reindexed incrementally. With this on, a batch that adds files is reindexed incrementally when the addition provably cannot disturb what the index already holds: no file in the index left anything unresolved, and no definition the added files bring is already there. Either reason, and any failure to read the index, falls back to a full build; removing a file still always forces one. The setting is part of the index identity, so switching it discards the index and costs one full build.

GeneralPrefPage_project_updated_from_database_only = Project only receives changes from the database

GeneralPrefPage_project_updated_from_database_only_tooltip = Off by default. Turn this on for a project that is only ever filled from a database. A comparison then loads structure alone and skips the analysis, and no background index is built, which makes Get Changes several times faster on a large project. What stops working: hover documentation, the file outline, go to definition, error markers in project files, and the warning about unchecked dependencies when saving to the project - the dependency checkbox becomes unavailable rather than silently doing nothing. Asking for a migration script recomputes the comparison in full, so a script is never built from a model loaded this way. Rules of type=COLUMN in the ignore list do not apply in this mode either, so every column reaches the project, including the ones such a rule would otherwise hide.

GeneralPrefPage_pg_routine_body_skip_matched_analysis = Skip dependency analysis for matching PostgreSQL routine bodies

GeneralPrefPage_pg_routine_body_skip_matched_analysis_tooltip = Speeds up comparison by skipping dependency analysis for function and procedure bodies whose hashes match. Disable to force full body analysis.

GeneralPrefPage_ignore_concurrent_modification = Ignore concurrent modification errors when reading DB

GeneralPrefPage_get_changes_parser_workers = Parser workers for PostgreSQL Get Changes:

GeneralPrefPage_project_index_parser_workers = Parser workers for project indexing:

GeneralPrefPage_parser_workers_tooltip = More workers can reduce elapsed time but increase CPU and heap pressure. The Get Changes value applies to PostgreSQL; project indexing uses its separate value for every database type. Both defaults scale with the machine - half of the available processors, at least 2 and at most 8 - and are the same in the standalone application and in the Eclipse plug-in. A workspace value entered here always wins, and a project may override the schema exclusions but not the worker counts. Changes apply to the next operation.

GeneralPrefPage_reuse_open_compare_editor = Reuse compare editor instead of opening new ones

GeneralPrefPage_show_diff_errors = Show errors while getting changes

GeneralPrefPage_show_full_code = Show code of all child objects when comparing

GeneralPrefPage_simplify_not_null = Simplified reading of NOT NULL constraints via JDBC (only for PostgreSQL 18+)

GeneralPrefPage_simplify_view = Simple formatting for VIEWs when reading via JDBC (not recommended by PostgreSQL)

GeneralPrefPage_time_to_clean_parser_cache = Free parser cache memory if not used for (minutes):

GeneralPrefPage_use_parallel_load = Use parallel database loading

