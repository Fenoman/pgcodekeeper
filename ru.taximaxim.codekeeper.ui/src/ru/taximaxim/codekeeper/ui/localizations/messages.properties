PaneMarkLegend_kept = not ignored - something depends on it

PaneMarkLegend_kept_by = %s - needed by %s

PaneMarkLegend_kept_hint = An ignore rule of type=COLUMN names these columns, but something in the database still needs each of them, so the rule does not apply.\nThey are compared and written exactly like a column no rule mentions:

PaneMarkLegend_leaving = ignored - not written to the project

PaneMarkLegend_leaving_hint = An ignore rule of type=COLUMN names these columns and nothing in the database needs them.\nThey take no part in the comparison, no migration script names them, and the project files of this table are written without them:

PaneMarkLegend_unmigratable = difference no migration can carry

PaneMarkLegend_unmigratable_hint = These lines declare a column whose collation differs from the other side, while the state this migration produces names no collation at all.\nNo migration script can express that: a column declared without a collation and a column declared with the default collation of its type are the same thing to pgCodeKeeper, so nothing is ever written to reach one from the other. Unlike a value a setting puts outside the comparison, this is not a choice and does not come back: it will still be here after this migration and after every migration that follows. Change it by hand, or declare the collation on the side the migration produces.

PaneMarkLegend_value = value outside the comparison

PaneMarkLegend_value_hint = These lines state a value the settings of this comparison declare the project's own: the cache of a sequence (Ignore sequence cache) or the statistics target of a column (Ignore column statistics).\nThe two sides may differ in it, no migration script carries that difference, and a database created from the project gets exactly the value shown here.

PaneMarkRuler_hint = i - this line takes no part in the comparison and no migration script carries it

