GeneralPrefPage_catalog_cache_tooltip = Catalog rows and routine body hashes that comparisons reuse instead of reading them from the database again. Unreachable entries are removed automatically; clear the cache manually only to reclaim disk space at once. The next comparison against each database reads its full catalog again.

